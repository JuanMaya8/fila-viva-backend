services:
  - type: web
    name: fila-viva-backend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DB_SYNCHRONIZE
        value: "true"
      - key: PREDICTION_SERVICE_URL
        value: https://fila-viva-ai.onrender.com
